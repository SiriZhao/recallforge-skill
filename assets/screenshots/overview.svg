<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title>RecallForge workflow schematic</title><rect width="1200" height="540" rx="28" fill="#f8fafc"/><text x="60" y="82" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">From course material to exam-ready review</text><g font-family="Arial" font-size="22" font-weight="700" text-anchor="middle"><g fill="#e2e8f0"><rect x="55" y="180" width="180" height="105" rx="18"/><rect x="290" y="180" width="180" height="105" rx="18"/><rect x="525" y="180" width="180" height="105" rx="18"/><rect x="760" y="180" width="180" height="105" rx="18"/><rect x="965" y="180" width="180" height="105" rx="18"/></g><g fill="#0f172a"><text x="145" y="223">Materials</text><text x="145" y="252">+ past papers</text><text x="380" y="223">Evidence</text><text x="380" y="252">understanding</text><text x="615" y="223">Knowledge</text><text x="615" y="252">+ exam map</text><text x="850" y="223">Active recall</text><text x="850" y="252">+ practice</text><text x="1055" y="223">Targeted</text><text x="1055" y="252">review</text></g><g stroke="#fb923c" stroke-width="6" fill="none"><path d="M240 232h40"/><path d="M475 232h40"/><path d="M710 232h40"/><path d="M945 232h10"/></g></g><rect x="180" y="365" width="840" height="102" rx="18" fill="#0f172a"/><text x="600" y="408" fill="#fb923c" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle">Evidence boundaries stay visible</text><text x="600" y="443" fill="#e2e8f0" font-family="Arial" font-size="21" text-anchor="middle">Unknown material, mastery, and readiness are reported—not invented.</text></svg>
