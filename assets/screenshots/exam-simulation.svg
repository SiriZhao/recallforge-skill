<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title>Exam simulation schematic</title><rect width="1200" height="540" rx="28" fill="#f8fafc"/><text x="60" y="80" fill="#0f172a" font-family="Arial" font-size="34" font-weight="700">Exam-style output and time-boxed preparation</text><rect x="90" y="130" width="570" height="330" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><g font-family="Arial"><text x="135" y="185" fill="#0f172a" font-size="26" font-weight="700">Mock exam structure</text><path d="M135 225h420M135 275h350M135 325h390M135 375h300" stroke="#94a3b8" stroke-width="12"/><text x="135" y="425" fill="#64748b" font-size="20">Derived from available evidence—not a real exam prediction.</text></g><rect x="735" y="130" width="360" height="330" rx="20" fill="#0f172a"/><g font-family="Arial"><text x="780" y="185" fill="#fff" font-size="26" font-weight="700">1-hour cram</text><text x="780" y="245" fill="#fb923c" font-size="23">25 min · highest priority</text><text x="780" y="295" fill="#cbd5e1" font-size="23">20 min · weak topic recall</text><text x="780" y="345" fill="#cbd5e1" font-size="23">15 min · error check</text><text x="780" y="410" fill="#94a3b8" font-size="19">Time is allocated with rationale.</text></g></svg>
