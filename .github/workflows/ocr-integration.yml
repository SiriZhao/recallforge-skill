name: OCR Integration

on:
  workflow_dispatch:

jobs:
  ocr-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          python -m pip install --upgrade pip
          pip install -e .[test] rapidocr-onnxruntime
      - name: Run local OCR benchmark
        run: python benchmarks/ocr_benchmark.py benchmarks/results/ocr-ubuntu-reference.json
      - name: Upload reference result
        uses: actions/upload-artifact@v4
        with:
          name: ocr-reference
          path: benchmarks/results/ocr-ubuntu-reference.json
