name: Validate

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Compile
        run: python -m compileall recallforge

      - name: Run tests
        run: python -m pytest

      - name: Build and validate release package
        run: |
          python scripts/build_release.py
          python -m pytest tests/test_packaging.py

      - name: Check public branding and placeholder markers
        run: |
          ! git grep -n -i -E 'exam-review-skill|exam_review_skill|examforge' -- ':!.github/workflows/tests.yml'
          ! git grep -n -E 'TODO|TBD|coming soon|example\.com' -- README.md README.zh-CN.md SKILL.md docs ':!.github/workflows/tests.yml'
