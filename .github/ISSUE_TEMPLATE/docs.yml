name: Documentation issue
description: Report unclear, missing, or incorrect documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes: {label: Page or link}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What is unclear or incorrect?}
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested improvement}
