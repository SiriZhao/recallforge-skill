[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallforge-skill"
version = "2.0.0"
description = "Open-source AI exam review skill for active recall, knowledge reconstruction, weakness detection, adaptive practice, and exam simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ingestion = [
  "pypdf>=4.0.0",
  "PyMuPDF>=1.24.0",
  "python-pptx>=0.6.23",
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10"
]
test = ["pytest>=8.0.0", "jsonschema>=4.20.0", "recallforge-skill[ingestion]"]

[project.scripts]
recallforge = "recallforge.cli:main"
recallforge-skill = "recallforge.cli:main"

[tool.setuptools.packages.find]
include = ["recallforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
